# Copy to /etc/nginx/sites-available/amiri and enable the site.
# Point ssl_certificate paths at your Let's Encrypt files after certbot.

upstream amiri_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name amiriinsuranceagency.com www.amiriinsuranceagency.com;

    client_max_body_size 16m;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://amiriinsuranceagency.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.amiriinsuranceagency.com;

    # ssl_certificate     /etc/letsencrypt/live/amiriinsuranceagency.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/amiriinsuranceagency.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://amiriinsuranceagency.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name amiriinsuranceagency.com;

    # ssl_certificate     /etc/letsencrypt/live/amiriinsuranceagency.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/amiriinsuranceagency.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16m;
    server_tokens off;
    proxy_hide_header Server;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    root /var/www/amiri;
    location ^~ /static/uploads/crm {
        deny all;
        return 404;
    }
    location ^~ /uploads/crm {
        deny all;
        return 404;
    }
    location /static/ {
        alias /var/www/amiri/static/;
        expires 7d;
        access_log off;
    }

    location /healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://amiri_app;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://amiri_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
